<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ accion }} Producto - Dreamy Coffee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        <h1 class="mb-4">{{ accion }} Producto</h1>

        <form method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Producto</label>
                <input type="text" class="form-control" id="nombre" name="nombre" value="{{ producto.nombre if producto else '' }}" required>
            </div>
            
            <div class="mb-3">
                <label for="precio" class="form-label">Precio ($)</label>
                <input type="number" step="0.01" class="form-control" id="precio" name="precio" value="{{ producto.precio if producto else '' }}" required>
            </div>

            <div class="mb-3">
                <label for="existencias" class="form-label">Existencias totales</label>
                <input type="number" class="form-control" id="existencias" name="existencias" value="{{ producto.existencias if producto else '' }}" required>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('admin_productos') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
